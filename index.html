<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For My Love 💖</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'Georgia', serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 25%, #ffd1ff 50%, #c2a3ff 75%, #ff9a9e 100%);
    background-size: 400% 400%;
    animation: bgShift 15s ease infinite;
    touch-action: manipulation;
  }
  @keyframes bgShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* Start screen */
  #startScreen {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    z-index: 100;
    transition: opacity 1s ease;
  }
  #startScreen h2 {
    color: #fff; font-size: 1.8rem;
    text-shadow: 0 2px 10px rgba(255,100,150,0.6);
    margin-bottom: 30px; text-align: center; padding: 0 20px;
    animation: float 3s ease-in-out infinite;
  }
  #startBtn {
    padding: 18px 50px; font-size: 1.4rem;
    border: none; border-radius: 50px;
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white; cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 30px rgba(255,107,157,0.5);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 10px 30px rgba(255,107,157,0.5); }
    50% { transform: scale(1.08); box-shadow: 0 15px 40px rgba(255,107,157,0.8); }
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  /* Main scene */
  #scene { position: fixed; inset: 0; }

  /* Floating message */
  #messageBox {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 90%; max-width: 500px;
    z-index: 10;
    pointer-events: none;
  }
  .word {
    display: inline-block;
    font-size: 2.5rem;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,100,150,0.9),
                 0 0 40px rgba(255,150,200,0.6),
                 2px 2px 4px rgba(0,0,0,0.2);
    margin: 0 6px;
    opacity: 0;
    transform: translateY(30px) scale(0.5);
    animation: wordIn 0.8s forwards;
  }
  @keyframes wordIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .heartBeat {
    display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    25%, 75% { transform: scale(1.3); }
  }

  /* Hearts */
  .heart {
    position: absolute;
    font-size: 2rem;
    pointer-events: none;
    animation: rise linear forwards;
    user-select: none;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  /* Flowers around */
  .flower {
    position: absolute;
    font-size: 2.5rem;
    pointer-events: none;
    animation: bloom 4s ease-in-out infinite;
    user-select: none;
  }
  @keyframes bloom {
    0%, 100% { transform: scale(1) rotate(0deg); }
    50% { transform: scale(1.2) rotate(15deg); }
  }

  /* Sparkles */
  .sparkle {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 20px #ffb6d9;
    pointer-events: none;
    animation: twinkle 2s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* Final message */
  #finalMessage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    text-align: center;
    width: 90%; max-width: 500px;
    z-index: 20;
    transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
  }
  #finalMessage.show { transform: translate(-50%, -50%) scale(1); }
  #finalMessage h1 {
    font-size: 3rem; color: #fff;
    text-shadow: 0 0 30px #ff4d8b, 0 0 60px #ff80ab;
    margin-bottom: 15px;
    animation: glow 2s ease-in-out infinite;
  }
  #finalMessage p {
    font-size: 1.3rem; color: #fff;
    text-shadow: 0 2px 8px rgba(255,80,140,0.7);
    font-style: italic;
    line-height: 1.6;
  }
  @keyframes glow {
    0%, 100% { text-shadow: 0 0 30px #ff4d8b, 0 0 60px #ff80ab; }
    50% { text-shadow: 0 0 50px #ff4d8b, 0 0 90px #ff80ab, 0 0 120px #ffb6d9; }
  }

  /* Tap again button */
  #replayBtn {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    padding: 12px 30px;
    background: rgba(255,255,255,0.3);
    color: #fff; border: 2px solid #fff;
    border-radius: 30px; cursor: pointer;
    font-family: inherit; font-size: 1rem;
    backdrop-filter: blur(10px);
    opacity: 0;
    transition: opacity 1s;
    z-index: 30;
  }
  #replayBtn.show { opacity: 1; }

  .fadeOut { opacity: 0 !important; pointer-events: none; }
</style>
</head>
<body>

<div id="startScreen">
  <h2>A little surprise for you 💕<br>Tap to begin...</h2>
  <button id="startBtn">Open My Heart 💖</button>
</div>

<div id="scene">
  <div id="messageBox"></div>
  <div id="finalMessage">
    <h1>I Love You 💖</h1>
    <p>"You are my favorite notification,<br>my favorite hello,<br>and my forever."</p>
  </div>
  <button id="replayBtn" onclick="restart()">Play again 🌸</button>
</div>

<script>
  const messages = [
    ["Hey", "My", "Love", "💕"],
    ["You", "make", "me", "smile", "🌸"],
    ["Every", "second", "with", "you", "✨"],
    ["feels", "like", "magic", "🌷"],
    ["My", "heart", "beats", "only", "for", "you", "💗"],
  ];

  const flowers = ["🌸", "🌺", "🌷", "🌹", "🌼", "💐", "🏵️"];
  const hearts = ["💖", "💗", "💓", "💝", "❤️", "💞", "💕"];

  const messageBox = document.getElementById("messageBox");
  const finalMessage = document.getElementById("finalMessage");
  const startScreen = document.getElementById("startScreen");
  const replayBtn = document.getElementById("replayBtn");
  const scene = document.getElementById("scene");

  let heartInterval, sparkleInterval, flowerTimeout;

  function showWords(words, callback) {
    messageBox.innerHTML = "";
    words.forEach((w, i) => {
      const span = document.createElement("span");
      span.className = "word";
      if (hearts.includes(w) || flowers.includes(w) || w === "✨") {
        span.classList.add("heartBeat");
      }
      span.textContent = w;
      span.style.animationDelay = (i * 0.25) + "s";
      messageBox.appendChild(span);
    });
    setTimeout(callback, words.length * 250 + 1800);
  }

  function fadeOutWords(callback) {
    Array.from(messageBox.children).forEach((el, i) => {
      el.style.animation = "none";
      el.style.transition = "all 0.6s";
      setTimeout(() => {
        el.style.opacity = "0";
        el.style.transform = "translateY(-30px) scale(0.5)";
      }, i * 50);
    });
    setTimeout(callback, 800);
  }

  function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.bottom = "-50px";
    heart.style.fontSize = (1.5 + Math.random() * 2) + "rem";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";
    scene.appendChild(heart);
    setTimeout(() => heart.remove(), 8000);
  }

  function spawnSparkle() {
    const s = document.createElement("div");
    s.className = "sparkle";
    s.style.left = Math.random() * 100 + "vw";
    s.style.top = Math.random() * 100 + "vh";
    s.style.animationDelay = Math.random() * 2 + "s";
    scene.appendChild(s);
    setTimeout(() => s.remove(), 2500);
  }

  function placeFlowers() {
    const positions = [
      {top: "8%", left: "8%"}, {top: "10%", right: "10%"},
      {bottom: "12%", left: "10%"}, {bottom: "8%", right: "12%"},
      {top: "45%", left: "5%"}, {top: "50%", right: "5%"},
      {top: "25%", left: "50%"}, {bottom: "25%", left: "50%"},
    ];
    positions.forEach((pos, i) => {
      const f = document.createElement("div");
      f.className = "flower";
      f.textContent = flowers[Math.floor(Math.random() * flowers.length)];
      Object.assign(f.style, pos);
      f.style.animationDelay = (i * 0.3) + "s";
      f.style.opacity = "0";
      f.style.transition = "opacity 1s";
      scene.appendChild(f);
      setTimeout(() => f.style.opacity = "1", i * 150);
    });
  }

  function clearFlowers() {
    document.querySelectorAll(".flower").forEach(f => f.remove());
  }

  async function runStory() {
    placeFlowers();
    heartInterval = setInterval(spawnHeart, 400);
    sparkleInterval = setInterval(spawnSparkle, 300);

    for (let i = 0; i < messages.length; i++) {
      await new Promise(resolve => {
        showWords(messages[i], () => {
          fadeOutWords(resolve);
        });
      });
    }

    finalMessage.classList.add("show");
    // confetti hearts burst
    for (let i = 0; i < 30; i++) {
      setTimeout(spawnHeart, i * 80);
    }
    setTimeout(() => replayBtn.classList.add("show"), 1500);
  }

  function restart() {
    finalMessage.classList.remove("show");
    replayBtn.classList.remove("show");
    clearInterval(heartInterval);
    clearInterval(sparkleInterval);
    clearFlowers();
    document.querySelectorAll(".heart, .sparkle").forEach(e => e.remove());
    messageBox.innerHTML = "";
    setTimeout(runStory, 600);
  }

  document.getElementById("startBtn").addEventListener("click", () => {
    startScreen.classList.add("fadeOut");
    setTimeout(() => {
      startScreen.style.display = "none";
      runStory();
    }, 1000);
  });
</script>

</body>
</html>
