<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>♥ For Mirsha Atia ♥</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --pink: #ff5fa2;
    --deep: #c2185b;
    --cream: #fff0f6;
  }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    font-family: 'VT323', monospace;
    background: #1a0820;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,95,162,0.25), transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(194,24,91,0.3), transparent 45%),
      linear-gradient(135deg, #2a0a2e 0%, #4a0f3a 50%, #2a0a2e 100%);
    touch-action: manipulation;
    image-rendering: pixelated;
    -webkit-user-select: none; user-select: none;
  }

  /* CRT scanline overlay */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: 200;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg, rgba(0,0,0,0.12) 0px, rgba(0,0,0,0.12) 1px,
      transparent 2px, transparent 4px);
    mix-blend-mode: multiply;
  }

  /* twemoji images scale with font-size */
  img.emoji {
    height: 1em; width: 1em;
    margin: 0 .05em 0 .08em;
    vertical-align: -0.15em;
    display: inline-block;
  }

  /* pixel starfield */
  #stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  .pixstar {
    position: absolute; width: 3px; height: 3px;
    background: #ffd9ec; box-shadow: 0 0 6px #ff8fc4;
    animation: twinkle 2s steps(2) infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: .15; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
  }

  /* ---------- START SCREEN ---------- */
  #startScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    text-align: center; padding: 24px;
    transition: opacity .8s ease;
  }
  #startScreen .title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.1rem, 6vw, 2.1rem);
    color: var(--pink); line-height: 1.6;
    text-shadow: 3px 3px 0 var(--deep), 0 0 18px rgba(255,95,162,.8);
    animation: floaty 2.5s ease-in-out infinite;
  }
  #startScreen .sub {
    font-size: 1.5rem; color: var(--cream);
    margin: 22px 0 34px; letter-spacing: 1px; line-height: 1.4;
  }
  .pixbtn {
    font-family: 'Press Start 2P', monospace;
    font-size: .9rem; color: #fff; background: var(--pink);
    padding: 16px 26px; cursor: pointer; border: none; line-height: 1.5;
    box-shadow:
      0 4px 0 var(--deep), 0 8px 0 rgba(0,0,0,.35),
      inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.35);
    transition: transform .08s, box-shadow .08s;
  }
  .pixbtn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 var(--deep), inset -3px -3px 0 rgba(0,0,0,.25), inset 3px 3px 0 rgba(255,255,255,.35);
  }
  #startBtn { animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:.45} }
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

  /* ---------- SCENE ---------- */
  #scene { position: fixed; inset: 0; z-index: 1; }

  /* HUD love bar */
  #hud {
    position: absolute; top: 14px; left: 50%;
    transform: translateX(-50%);
    width: min(92%, 460px); z-index: 40;
    font-family: 'Press Start 2P', monospace;
    color: var(--cream); font-size: .55rem;
    opacity: 0; transition: opacity .6s;
  }
  #hud.show { opacity: 1; }
  #hud .row { display: flex; align-items: center; gap: 8px; }
  #barOuter {
    flex: 1; height: 16px; background: #3a0f30;
    border: 3px solid #ff9ecb; box-shadow: inset 0 0 0 2px #50163f;
  }
  #barInner {
    height: 100%; width: 0%;
    background: repeating-linear-gradient(90deg,#ff5fa2 0 8px,#ff86bd 8px 16px);
    transition: width .8s steps(10);
  }

  /* intro title card */
  #introCard {
    position: absolute; top: 44%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center; width: 92%; z-index: 15;
    opacity: 0; transition: opacity .6s;
  }
  #introCard.show { opacity: 1; }
  #introCard .small {
    font-size: 1.5rem; color: var(--cream);
    letter-spacing: 2px; margin-bottom: 16px;
  }
  #introCard .big {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1.1rem, 5.5vw, 1.9rem);
    color: var(--pink); line-height: 1.5;
    text-shadow: 3px 3px 0 var(--deep), 0 0 18px rgba(255,95,162,.8);
  }

  /* floating heart sprites */
  .heart {
    position: absolute; font-size: 2rem; z-index: 5;
    pointer-events: none; animation: rise linear forwards;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); opacity: 0; }
    12% { opacity: 1; }
    100% { transform: translateY(-112vh) rotate(360deg); opacity: 0; }
  }

  /* corner flowers */
  .flower {
    position: absolute; font-size: 2.2rem; z-index: 4;
    pointer-events: none; opacity: 0;
    transition: opacity 1s steps(4);
    animation: bob 3s steps(6) infinite;
  }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-7px) rotate(6deg)} }

  /* ---------- RPG DIALOGUE BOX ---------- */
  #dialogueWrap {
    position: absolute; left: 50%; bottom: 5%;
    transform: translateX(-50%) translateY(20px);
    width: min(94%, 600px); z-index: 25;
    opacity: 0; pointer-events: none;
    transition: opacity .5s, transform .5s;
  }
  #dialogueWrap.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  #dialogueBox {
    position: relative; cursor: pointer;
    background: rgba(26,8,32,.94);
    border: 4px solid #ff9ecb;
    box-shadow: 0 0 0 4px var(--deep), 0 0 26px rgba(255,95,162,.55), inset 0 0 0 2px #50163f;
    padding: 24px 20px 28px;
  }
  #nameplate {
    position: absolute; top: -17px; left: 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: .58rem; color: #fff; background: var(--deep);
    padding: 7px 11px; border: 3px solid #ff9ecb;
    box-shadow: 2px 2px 0 rgba(0,0,0,.4);
  }
  #pageNum {
    position: absolute; top: -14px; right: 14px;
    font-family: 'Press Start 2P', monospace;
    font-size: .5rem; color: #ffd9ec; background: #3a0f30;
    padding: 5px 8px; border: 2px solid #ff9ecb;
  }
  #dialogueText {
    font-size: clamp(1.15rem, 4.4vw, 1.55rem);
    color: var(--cream); line-height: 1.5;
    min-height: 9.5em; max-height: 46vh; overflow-y: auto;
  }
  #nextInd {
    position: absolute; right: 16px; bottom: 8px;
    color: #ffe14d; font-size: 1.5rem; opacity: 0;
    animation: bobInd .8s steps(2) infinite;
  }
  #nextInd.show { opacity: 1; }
  @keyframes bobInd { 0%,100%{transform:translateY(0)} 50%{transform:translateY(5px)} }
  .tapHint {
    text-align: center; font-size: 1.1rem; color: #ff9ecb;
    margin-top: 12px; letter-spacing: 1px; opacity: .8;
  }

  /* ---------- FINAL / YOU WIN ---------- */
  #finalMessage {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    width: min(92%, 540px); z-index: 30;
    background: rgba(42,10,46,.94);
    border: 4px solid #ff9ecb;
    box-shadow: 0 0 0 4px var(--deep), 0 0 30px rgba(255,95,162,.6), inset 0 0 0 2px #50163f;
    padding: 28px 22px; text-align: center;
    transition: transform .7s steps(8); pointer-events: none;
  }
  #finalMessage.show { transform: translate(-50%, -50%) scale(1); }
  #finalMessage h1 {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1rem, 5vw, 1.5rem);
    color: #ffe14d; line-height: 1.6; margin-bottom: 16px;
    text-shadow: 3px 3px 0 #b8860b, 0 0 18px rgba(255,225,77,.8);
    animation: glow 1.6s steps(3) infinite;
  }
  #finalMessage p {
    font-size: 1.55rem; color: var(--cream);
    line-height: 1.5; letter-spacing: .5px;
  }
  #finalMessage .sig {
    margin-top: 14px; color: #ff9ecb; font-size: 1.4rem;
  }
  @keyframes glow {
    0%,100% { filter: drop-shadow(0 0 6px #ffe14d); }
    50% { filter: drop-shadow(0 0 16px #ffe14d); }
  }

  #replayBtn {
    position: absolute; bottom: 32px; left: 50%;
    transform: translateX(-50%); z-index: 35;
    opacity: 0; pointer-events: none; transition: opacity .8s;
  }
  #replayBtn.show { opacity: 1; pointer-events: auto; }

  /* music toggle button */
  #musicBtn {
    position: fixed; top: 12px; right: 12px; z-index: 210;
    font-family: 'Press Start 2P', monospace; font-size: .7rem; line-height: 1;
    color: #fff; background: var(--deep);
    border: 3px solid #ff9ecb; padding: 9px 10px; cursor: pointer;
    box-shadow: 2px 2px 0 rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .5s;
  }
  #musicBtn.show { opacity: 1; pointer-events: auto; }
  #musicBtn:active { transform: translateY(2px); }

  /* hidden youtube background player */
  #ytwrap {
    position: fixed; bottom: 0; left: 0;
    width: 2px; height: 2px; overflow: hidden;
    opacity: 0.001; z-index: -1; pointer-events: none;
  }

  .fadeOut { opacity: 0 !important; pointer-events: none; }
</style>
</head>
<body>

<div id="stars"></div>

<button id="musicBtn" title="Music on/off">🔊</button>
<div id="ytwrap"><div id="ytplayer"></div></div>

<div id="startScreen">
  <div class="title">♥ FOR<br>MIRSHA ♥</div>
  <div class="sub">A little Love Quest,<br>just for you 💌</div>
  <button id="startBtn" class="pixbtn">▶ PRESS START 💖</button>
</div>

<div id="scene">
  <div id="hud">
    <div class="row">
      <span class="label">LOVE 💗</span>
      <div id="barOuter"><div id="barInner"></div></div>
    </div>
  </div>

  <div id="introCard">
    <div class="small">A letter to my dearest...</div>
    <div class="big">MIRSHA ATIA ❤️</div>
  </div>

  <div id="dialogueWrap">
    <div id="dialogueBox">
      <div id="nameplate">💌 To My Dearest</div>
      <div id="pageNum">1 / 9</div>
      <div id="dialogueText"></div>
      <span id="nextInd">▼</span>
    </div>
    <div class="tapHint">▶ tap to continue</div>
  </div>

  <div id="finalMessage">
    <h1>★ YOU WIN ★<br>LOVE +∞ 💖</h1>
    <p>My favorite chapter in a story<br>I never want to end. ❤️</p>
    <div class="sig">— Forever yours, for Mirsha Atia 🌹</div>
  </div>

  <button id="replayBtn" class="pixbtn" onclick="restart()">↻ READ AGAIN 🌸</button>
</div>

<script src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/dist/twemoji.min.js" crossorigin="anonymous"></script>
<script>
  // ---- game-style emoji (Twemoji: consistent + cute, not native phone) ----
  const TW = { folder: 'svg', ext: '.svg', base: 'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/' };
  function paint(el) { if (window.twemoji) twemoji.parse(el, TW); }

  // ---- the letter, broken into RPG dialogue pages ----
  const pages = [
    "Before you came into my life, every day felt ordinary. I woke up, went through my routines, and slept, never realizing that someone could completely change the way I see the world. Then you appeared, and suddenly the smallest moments became my favorite memories.",
    "Thank you for being the person who listens to me when I have too much on my mind, for staying when things are difficult, and for loving me even when I'm not at my best. You may not realize it, but your presence brings a kind of peace that I never knew I needed.",
    "There are thousands of beautiful people in this world, but none of them are you. None of them have your smile, your laugh, your way of caring, or the warmth you bring into my life. What makes you special isn't just how beautiful you are; it's how you make me feel safe, understood, and appreciated.",
    "Sometimes I wonder if you truly know how much you mean to me. You're not just someone I love. You're the person I think about when something good happens and the first person I want to tell. You're the reason difficult days feel easier and the reason I keep believing that life can be beautiful.",
    "If one day I become successful, I want you to know that a part of that success belongs to you, because you were there during the days when I doubted myself. You encouraged me, supported me, and reminded me to keep moving forward.",
    "No matter how many people I meet in this life, there will only ever be one Mirsha Atia in my heart. The truth is, I don't need a perfect person. I just need you. Your flaws, your imperfections, your little habits, your random moods, everything that makes you who you are.",
    "And if I could make one wish, it would be to keep creating memories with you for as long as life allows. To laugh with you, grow with you, support you, and remind you every day how deeply you are loved.",
    "So if you ever doubt yourself, if you ever feel like you're not enough, read this again and remember that somewhere in this world, there is someone whose life became brighter because you exist.",
    "Thank you for being you, Mirsha Atia. Thank you for being my favorite chapter in a story I never want to end. ❤️",
  ];

  const flowers = ["🌸", "🌺", "🌷", "🌹", "🌼", "💐"];
  const hearts  = ["💖", "💗", "💓", "💝", "❤️", "💞", "💕"];

  const startScreen = document.getElementById("startScreen");
  const scene       = document.getElementById("scene");
  const hud         = document.getElementById("hud");
  const barInner    = document.getElementById("barInner");
  const introCard   = document.getElementById("introCard");
  const dialogueWrap= document.getElementById("dialogueWrap");
  const dialogueBox = document.getElementById("dialogueBox");
  const dialogueText= document.getElementById("dialogueText");
  const nameplate   = document.getElementById("nameplate");
  const pageNum     = document.getElementById("pageNum");
  const nextInd     = document.getElementById("nextInd");
  const finalMessage= document.getElementById("finalMessage");
  const replayBtn   = document.getElementById("replayBtn");

  let heartInterval, pageIndex = 0, typing = false, typeTimer;

  // ---- tiny 8-bit blip while typing ----
  let actx;
  function initAudio(){ try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  function blip(){
    if (!actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = "square"; o.frequency.value = 420 + Math.random()*140;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(0.016, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    o.start(t); o.stop(t + 0.06);
  }

  // pixel starfield
  (function buildStars(){
    const wrap = document.getElementById("stars");
    for (let i = 0; i < 60; i++) {
      const s = document.createElement("div");
      s.className = "pixstar";
      s.style.left = Math.random()*100 + "vw";
      s.style.top  = Math.random()*100 + "vh";
      s.style.animationDelay = (Math.random()*2) + "s";
      wrap.appendChild(s);
    }
  })();

  function spawnHeart() {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = hearts[Math.floor(Math.random()*hearts.length)];
    heart.style.left = Math.random()*100 + "vw";
    heart.style.bottom = "-50px";
    heart.style.fontSize = (1.3 + Math.random()*1.7) + "rem";
    heart.style.animationDuration = (5 + Math.random()*4) + "s";
    scene.appendChild(heart);
    paint(heart);
    setTimeout(() => heart.remove(), 9000);
  }

  function placeFlowers() {
    const positions = [
      {top:"11%",left:"5%"}, {top:"13%",right:"6%"},
      {top:"40%",left:"3%"}, {top:"46%",right:"3%"},
    ];
    positions.forEach((pos, i) => {
      const f = document.createElement("div");
      f.className = "flower";
      f.textContent = flowers[Math.floor(Math.random()*flowers.length)];
      Object.assign(f.style, pos);
      f.style.animationDelay = (i*0.25) + "s";
      scene.appendChild(f);
      paint(f);
      setTimeout(() => f.style.opacity = "1", i*150);
    });
  }

  function clearSprites() {
    document.querySelectorAll(".flower, .heart").forEach(e => e.remove());
  }

  // ---- typewriter ----
  function typePage(text) {
    typing = true;
    nextInd.classList.remove("show");
    dialogueText.textContent = "";
    const chars = Array.from(text);
    let i = 0;
    typeTimer = setInterval(() => {
      if (i < chars.length) {
        dialogueText.textContent += chars[i];
        if (i % 2 === 0 && chars[i] !== " ") blip();
        dialogueText.scrollTop = dialogueText.scrollHeight;
        i++;
      } else {
        clearInterval(typeTimer);
        typing = false;
        paint(dialogueText);
        nextInd.classList.add("show");
      }
    }, 26);
  }

  function showPage(idx) {
    pageNum.textContent = (idx + 1) + " / " + pages.length;
    barInner.style.width = Math.round(((idx + 1) / pages.length) * 100) + "%";
    typePage(pages[idx]);
  }

  function advance() {
    if (typing) {                      // skip typing -> reveal full page
      clearInterval(typeTimer);
      dialogueText.textContent = pages[pageIndex];
      paint(dialogueText);
      dialogueText.scrollTop = dialogueText.scrollHeight;
      typing = false;
      nextInd.classList.add("show");
      return;
    }
    pageIndex++;
    if (pageIndex < pages.length) {
      showPage(pageIndex);
    } else {
      endStory();
    }
  }
  dialogueBox.addEventListener("click", advance);

  function endStory() {
    dialogueWrap.classList.remove("show");
    barInner.style.width = "100%";
    finalMessage.classList.add("show");
    for (let i = 0; i < 32; i++) setTimeout(spawnHeart, i * 70);
    setTimeout(() => replayBtn.classList.add("show"), 1400);
  }

  function startSequence() {
    pageIndex = 0;
    placeFlowers();
    hud.classList.add("show");
    barInner.style.width = "0%";
    heartInterval = setInterval(spawnHeart, 600);

    // intro title card
    introCard.classList.add("show");
    paint(introCard);
    setTimeout(() => {
      introCard.classList.remove("show");
      setTimeout(() => {
        dialogueWrap.classList.add("show");
        showPage(0);
      }, 700);
    }, 2800);
  }

  function restart() {
    finalMessage.classList.remove("show");
    replayBtn.classList.remove("show");
    hud.classList.remove("show");
    dialogueWrap.classList.remove("show");
    clearInterval(heartInterval);
    clearInterval(typeTimer);
    typing = false;
    clearSprites();
    dialogueText.textContent = "";
    setTimeout(startSequence, 600);
  }

  // ---- background music: Fajar Noor - Tuhan Tahu Kita Saling Cinta ----
  const SONG_ID = "HKqnBYaEYXc";
  // mula terus di chorus "Haruskah ku lepaskan atau ku pertahankan" lalu main sampai habis.
  // tukar nilai detik ni kalau nak laras (cth 52 = awal sikit, 64 = lewat sikit)
  const SONG_START = 58;
  const musicBtn = document.getElementById("musicBtn");
  let ytPlayer, ytReady = false, wantPlay = false, musicOn = false, firstPlay = true;

  (function loadYT(){
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);
  })();

  window.onYouTubeIframeAPIReady = function () {
    ytPlayer = new YT.Player("ytplayer", {
      height: "2", width: "2", videoId: SONG_ID,
      playerVars: {
        autoplay: 0, controls: 0, start: SONG_START,
        playsinline: 1, modestbranding: 1, rel: 0,
      },
      events: {
        onReady: (e) => { ytReady = true; e.target.setVolume(40); if (wantPlay) playMusic(); },
        onStateChange: (e) => {
          if (e.data === YT.PlayerState.ENDED) {     // habis -> ulang dari chorus, bukan dari awal
            try { ytPlayer.seekTo(SONG_START, true); ytPlayer.playVideo(); } catch(err){}
          }
        },
      },
    });
  };

  function refreshMusicBtn(){
    musicBtn.textContent = musicOn ? "🔊" : "🔇";
    paint(musicBtn);
  }
  function playMusic(){
    if (!ytReady) { wantPlay = true; return; }
    try {
      if (firstPlay) { ytPlayer.seekTo(SONG_START, true); firstPlay = false; }
      ytPlayer.unMute(); ytPlayer.setVolume(40); ytPlayer.playVideo();
      musicOn = true; refreshMusicBtn();
    } catch(e){}
  }
  musicBtn.addEventListener("click", () => {
    if (!ytReady) { playMusic(); return; }
    if (musicOn) { try { ytPlayer.pauseVideo(); } catch(e){} musicOn = false; }
    else { try { ytPlayer.unMute(); ytPlayer.playVideo(); } catch(e){} musicOn = true; }
    refreshMusicBtn();
  });

  document.getElementById("startBtn").addEventListener("click", () => {
    initAudio();
    playMusic();
    musicBtn.classList.add("show");
    startScreen.classList.add("fadeOut");
    setTimeout(() => { startScreen.style.display = "none"; startSequence(); }, 850);
  });

  // paint static emoji already on the page
  paint(document.body);
</script>

</body>
</html>
